# TEMPLATE ONLY. Network remains disabled until you supply an explicit budget,
# endpoint, credentials environment variable and current prices/quotas.
pipeline:
  stage1_concurrency: 8
  stage2_concurrency: 8
  max_inflight_total: 16
  queue_capacity: 128
  max_format_retries: 2
  max_transport_retries: 3
  request_timeout_seconds: 180
rate_limit:
  requests_per_minute: null
  input_tokens_per_minute: null
  output_tokens_per_minute: null
  combined_tokens_per_minute: null
  utilization_target: 0.75
inference:
  provider: openai_compatible
  base_url: https://YOUR-PROVIDER/v1
  api_key_env: CODEGUARD_API_KEY
  model_id: CONFIGURE_ME
  model_revision: CONFIGURE_ME
  allow_network: false
  reasoning_effort: null
  structured_output: json_schema
  completion_token_parameter: max_completion_tokens
  input_price_per_million: 0
  output_price_per_million: 0
  currency: USD
  reserved_output_tokens_stage1: 1200
  reserved_output_tokens_stage2: 600
run:
  max_spend: null
  cache_policy: "off"
