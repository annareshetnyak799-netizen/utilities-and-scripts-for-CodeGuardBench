[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "codeguard-judge"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = ["bashlex==0.18", "jsonschema==4.25.1", "pydantic>=2.10,<3", "httpx>=0.27,<1", "PyYAML>=6,<7"]
[project.scripts]
codeguard-judge = "codeguard_judge.__main__:main"
judge-v2 = "codeguard_judge_v2.cli:main"
[tool.setuptools.packages.find]
include = ["codeguard_judge*", "judge*"]
[tool.setuptools.package-data]
codeguard_judge = ["data/*.json"]
codeguard_judge_v2 = ["policy/*.json", "policy/*.yaml", "prompts/*.txt", "fixtures/*.json"]
judge = ["prompts/*.md", "schema.json"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
