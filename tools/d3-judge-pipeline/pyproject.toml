[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "codeguard-judge"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["bashlex==0.18", "jsonschema==4.25.1"]
[project.scripts]
codeguard-judge = "codeguard_judge.__main__:main"
[tool.setuptools.packages.find]
include = ["codeguard_judge*", "judge*"]
[tool.setuptools.package-data]
codeguard_judge = ["data/*.json"]
judge = ["prompts/*.md", "schema.json"]
